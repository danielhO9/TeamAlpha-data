# Machine-readable field reliability contract for the research agent / guardrails.
# Human companion: DATA_CONTRACT.md. Keep both in sync.
version: "2026-09-03"
ruleset_version: "1.28.0"

coverage:
  krx_equity: {from: "1995-05-02", assets: 6677, survivorship_bias: false}
  krx_index: {from: "2010-01-04", codes: ["1028", "2203"]}
  fmp_us_equity: {from: "2015-01-02", assets: 8720, survivorship_bias: false}
  fmp_commodity: {from: "2015-01-01", assets: 28}
  fmp_fx: {from: "2015-01-01", assets: 1, symbol: "USDKRW"}
  dart_fundamental: {from: "2015-03-31"}
  dart_full_statement_lines: {from: "2015-01-01", availability: "after certified backfill"}
  dart_ownership_disclosures: {availability: "after certified backfill"}
  dart_industry_observation: {availability: "current snapshot forward; no historical effective dates"}
  krx_investor_flow: {availability: "licensed export only"}
  krx_short_balance: {from: "2016-06-30", availability: "licensed observed vintages only"}
  dart_dividend: {from: "2013-09-30"}
  fmp_fundamental: {from: "2015-01-02"}

# Requested-but-absent. Factors requiring these CANNOT be built; do not proxy.
not_provided:
  - free_float_shares
  - order_book
  - historical_short_balance_vintages_before_first_authorized_observation
  - securities_lending
  - historical_sector_classification_pit_before_first_dart_observation

sources:
  krx: {trust: internally_validated}
  dart: {trust: internally_validated}
  fmp:
    trust: vendor_trusted_not_internally_validated
    note: "total_assets<=0 / revenue<0 / accounting mismatch can exist by vendor convention"

tables:
  price_daily:
    fields:
      close:
        meaning: "raw closing price, unadjusted/nominal"
        unit: currency
        validated: true
        safe_for: [point_in_time_display]
        unsafe_for: [time_series_return, momentum, any_cross_time_ratio]
      open: {meaning: "raw open; NULL on zero-volume no-trade days", validated: true}
      high: {meaning: "raw high; NULL on zero-volume no-trade days", validated: true}
      low: {meaning: "raw low; NULL on zero-volume no-trade days", validated: true}
      adj_close:
        meaning: "source price-adjustment series; KRX is reconstructed from official reference-price/previous-difference adjustment factors"
        unit: currency
        validated: true
        reliability: high
        safe_for: [price_momentum, reversal, volatility, technical, beta]
        unsafe_for: [total_return, dividend_yield, carry]
        note: "Not by itself a certified cash total-return label; v3 separately adds audited adjusted cash dividends to forward gross returns"
      total_return_close:
        meaning: "KRX gross total-return index: anchor each listing episode at its first adj_close, then forward-compound (adj_close[t]+adjusted_cash[t])/adj_close[t-1]; latest-corrected ex-post forward label"
        unit: currency
        validated: conditional
        reliability: certified_label_only
        certification:
          source: KRX
          required_status: CERTIFIED
          methodology_version: krx_gross_dividend_reinvested_v3
          action_snapshot_schema: dart_total_return_action_snapshot_v5
          action_vintage: latest_corrected_action_snapshot
          research_role: ex_post_realized_forward_return_label
          feature_pit_safe: false
        safe_for: [forward_return_label, realized_performance_evaluation]
        unsafe_for: [factor_feature, historical_candidate_input, momentum, dividend_yield, dividend_growth, dividend_frequency, carry]
        caveats:
          - "Use only when price_return_contract is CERTIFIED and every row is bound to the certified total-return run"
          - "The v5 action snapshot applies latest corrections retroactively; without bitemporal action vintages this is not a PIT feature"
          - "Dividend application dates are audited in append-only dividend_event_resolution; research code must not derive them from record_date"
          - "FMP uses vendor-native dividend-adjusted adjClose and does not inherit the KRX v3/v5 certification"
      volume: {meaning: "traded shares; 0 == no-trade (OHLC NULL)", validated: true}
      trading_value: {meaning: "traded value", unit: currency, validated: true}
      shares:
        meaning: "TOTAL listed shares (LIST_SHRS)"
        unit: shares
        validated: true
        unsafe_for: [free_float_weighting]
        note: "NOT free float"
      market_cap: {meaning: "market cap == close*shares (reconciled)", unit: currency, validated: true}
      market: {meaning: "KOSPI|KOSDAQ|KONEX (KRX) / exchange", validated: true}

  fundamental:
    layout: "long format: (metric, value) per (asset_id, period_end, fiscal_period, fs_type, revision_key)"
    pit_field: available_date
    pit_note: "look-ahead-safe: available_date > period_end, enforced CRITICAL (FUNDAMENTAL_PIT_ORDER)"
    restatements:
      present: true
      note: "DART carries restatements: same period_end has multiple revision_key, each with its own available_date"
      as_of_rule: "select latest revision per (asset_id, period_end, fs_type, metric) with available_date <= as_of_date; NEVER just the latest revision (that is look-ahead)"
      as_of_sql: "SELECT DISTINCT ON (asset_id,period_end,fs_type,metric) * FROM fundamental WHERE source='DART' AND available_date <= :as_of ORDER BY asset_id,period_end,fs_type,metric,available_date DESC,revision_key DESC"
    dart:
      validated: true
      validations: [FUNDAMENTAL_VALUE_PLAUSIBILITY, FUNDAMENTAL_ACCOUNTING_EQUATION_GROSS, DIVIDEND_NONNEGATIVE, FUNDAMENTAL_PIT_ORDER]
      metrics_bs: [total_assets, current_assets, noncurrent_assets, total_liabilities, current_liabilities, noncurrent_liabilities, total_equity, capital_stock, retained_earnings]
      metrics_is: [revenue, operating_income, pretax_income, net_income, comprehensive_income]
      metrics_dividend: [cash_dividend_per_share, dividend_yield, stock_dividend_per_share, payout_ratio]
      metrics_absent: [cogs, sga, cash, cfo, capex, depreciation]
      note: "fs_type CFS(consolidated)/OFS(separate) — do not mix within a scope"
    fmp:
      validated: false
      trust: vendor_trusted
      statements: [BS, IS, CF]
      note: "US only; not internally validated"

  fundamental_statement_line:
    layout: "all numeric OpenDART BS/IS/CIS/CF/SCE lines for CFS/OFS"
    pit_field: available_date
    pit_note: "conservative next-day availability; always filter available_date <= as_of"
    validated: conditional
    safe_for: [explicit_account_id_research, accounting_feature_discovery]
    unsafe_for: [blind_account_name_aggregation, mixing_cfs_ofs, using_current_view_for_historical_as_of]
    note: "Source lines are retained without forced semantic mapping. A factor must freeze account_id mappings and test coverage/unit/sign semantics."

  ownership_disclosure_event:
    pit_field: available_date
    validated: conditional
    safe_for: [ownership_change_disclosure_features, source_audit]
    unsafe_for: [exact_insider_trade_execution_date, exact_execution_price]
    note: "OpenDART elestock/majorstock filing events; disclosures, not an exchange trade tape."

  investor_flow_daily:
    pit_field: available_at
    validated: conditional
    provenance_required: KRX_DATA_MARKETPLACE_AUTHORIZED_EXPORT
    safe_for: [foreign_institutional_flow_features]
    unsafe_for: [unlicensed_scraped_inputs, same_close_use_before_available_at]
    note: "Populated only from a purchased/approved KRX export with authorization_id and source SHA-256."

  industry_classification_observation:
    pit_field: available_at
    validated: conditional
    safe_for: [prospective_industry_grouping, current_cross_section_grouping]
    unsafe_for: [retroactive_historical_sector_neutralization_before_available_at]
    note: "DART company overview current induty_code; the API does not provide a historical effective date."

  short_position_balance_observation:
    pit_field: available_at
    validated: conditional
    provenance_required: KRX_DATA_MARKETPLACE_AUTHORIZED_EXPORT
    safe_for: [prospective_short_balance_features, source_audit]
    unsafe_for: [retroactive_use_before_observed_at, interpreting_as_total_market_short_interest]
    note: "KRX aggregates reportable short net positions and may receive later corrections; first-observed vintage is preserved."

  corporate_action:
    feature_pit_certified: false
    action_vintage:
      krx_dart_total_return_subset: latest_corrected_action_snapshot
      historical_as_of: unavailable
    safe_for: [source_audit, certified_label_lineage]
    unsafe_for: [factor_feature, dividend_yield, dividend_growth, dividend_frequency, carry]
    note: "Not bitemporal: direct corporate-action history does not reproduce what was known at each historical as-of date"
    fields:
      action_type: {values: [cash_dividend, stock_split, reverse_split, capital_reduction, bonus_issue, merger, rights_detachment, listing_change, delisting, trading_halt]}
      ex_date: {meaning: "ex-date", note: "May be NULL on KRX cash source rows; never infer it in research code—use certified dividend_event_resolution"}
      record_date: {meaning: "baedang gijunil (KRX dividend anchor)"}
      cash_amount: {meaning: "cash dividend per share", coverage: "partial for KRX (~17761/19880)"}
      adjusted_cash_amount: {meaning: "split-adjusted per-share dividend"}

  dividend_history:
    type: view
    source: corporate_action
    feature_pit_certified: false
    action_vintage:
      krx_dart_total_return_subset: latest_corrected_action_snapshot
      historical_as_of: unavailable
    safe_for: [source_audit, certified_label_lineage_inspection]
    unsafe_for: [factor_feature, dividend_yield, dividend_growth, dividend_frequency, carry]
    note: "Latest-corrected event view, not an as-of action-vintage history"

  asset:
    fields:
      asset_id: {meaning: "surrogate key; reused tickers map to distinct asset_ids (no identity collision)"}
      name: {meaning: "issuer/security name"}
      asset_type: {values: [stock, index, commodity, fx]}
      exchange: {meaning: "KRX / NYSE / NASDAQ / AMEX / COMMODITY / FX"}
      sector: {present: false, note: "not provided"}

quality_guarantees:
  guaranteed:
    - no_null_close
    - non_positive_prices_excluded
    - market_cap_equals_close_times_shares_within_1pct
    - fundamental_point_in_time_order
    - fundamental_value_plausibility
    - accounting_equation_gross_excluded
    - adj_close_reconciliation_consistent
    - no_duplicate_price_rows
    - no_active_security_identifier_collision
  conditional:
    krx_total_return_v3_v5:
      when: "price_return_contract.status == CERTIFIED"
      guarantees: [methodology_v3, action_snapshot_v5, latest_corrected_action_binding, append_only_resolution, action_body_price_digest_parity, per_row_run_parity]
      research_role: ex_post_realized_forward_return_label
      feature_pit_safe: false
  not_guaranteed:
    - un_encoded_error_types
    - warning_severity_items
    - fmp_fundamental_accuracy
    - corporate_action_feature_pit_safety
    - dividend_history_feature_pit_safety
    - fmp_total_return_krx_v3_v5_certification
    - anything_in_not_provided

outlier_policy:
  statement: "extreme returns are mostly real (penny/distressed stocks), not errors"
  action: "winsorize returns and apply a liquidity filter at factor-construction time"
  flags_location: "dq_warning_state worklist; inspect via `python -m pipeline.silver_quality.review list`"

factor_guidance:
  price_momentum_reversal_volatility: {use: [adj_close], avoid: [close]}
  forward_return_label: {use: [total_return_close], role: ex_post_realized_forward_return_label, feature_pit_safe: false}
  dividend_yield_growth_frequency_carry: {buildable: false, avoid: [corporate_action.cash_dividend, dividend_history], reason: "direct dividend history is not bitemporal/PIT-certified for features"}
  value_quality_kr: {use: [fundamental.dart.bs, fundamental.dart.is, fundamental_statement_line, market_cap], avoid: [unfrozen_account_name_mapping, fmp_mixing]}
  ownership_change_kr: {use: [ownership_disclosure_event], note: "disclosure timing only; not exact trade execution"}
  foreign_flow_kr: {use: [investor_flow_daily], note: "only after licensed-export certification"}
  sector_neutralization_kr: {use: [industry_classification_observation], note: "only on/after the observation available_at"}
  short_balance_kr: {use: [short_position_balance_observation], note: "reported-threshold aggregate, not complete market short interest"}
  liquidity_size: {use: [trading_value, market_cap, shares], note: "shares != free float"}
  us_factors: {use: [fmp_price, fmp_fundamental], note: "vendor-trusted"}
  float_short_orderbook_based: {buildable: false, reason: not_provided}
